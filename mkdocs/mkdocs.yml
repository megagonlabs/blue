site_name: Blue Docs
repo_url: https://github.com/rit-git/blue
theme:
    name: material
    logo: assets/logo.svg
    favicon: assets/favicon.ico
    custom_dir: overrides
    features:
        - navigation.instant
        - content.action.edit
        - content.action.view
    icon:
        admonition:
            example: fontawesome/solid/laptop-code
        repo: fontawesome/brands/github
watch:
    - ../lib/src/blue
plugins:
    - offline
    - search
    - document-dates:
          type: timeago
          show_author: false
    - mkdocstrings:
          default_handler: python
          handlers:
              python:
                  options:
                      docstring_style: google
markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.magiclink
extra:
    version:
        provider: mike
        alias: true
    social:
        - icon: fontawesome/brands/linkedin
          link: https://www.linkedin.com/company/megagon-labs
        - icon: fontawesome/brands/twitter
          link: https://twitter.com/MegagonLabs
        - icon: fontawesome/brands/facebook
          link: https://www.facebook.com/megagonlabs/
